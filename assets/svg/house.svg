<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E76F51"/>
      <stop offset="100%" stop-color="#B24930"/>
    </linearGradient>
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F2E6D8"/>
    </linearGradient>
    <linearGradient id="door-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C58554"/>
      <stop offset="100%" stop-color="#9C5A2B"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE3A8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FFE3A8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFE3A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Chimney with smoke -->
  <rect x="270" y="80" width="34" height="60" fill="#B24930"/>
  <rect x="266" y="74" width="42" height="10" rx="2" fill="#8C3520"/>
  <!-- Curly Smoke -->
  <g fill="#F5ECE1" opacity="0.75">
    <circle cx="287" cy="55" r="10"/>
    <circle cx="295" cy="36" r="13"/>
    <circle cx="310" cy="18" r="15"/>
  </g>

  <!-- House Main Walls -->
  <rect x="70" y="160" width="260" height="230" rx="4" fill="url(#wall-grad)"/>

  <!-- Attic Gable Triangle -->
  <polygon points="200,60 50,170 350,170" fill="url(#roof-grad)"/>
  <!-- Roof Overhang Rim -->
  <polygon points="200,52 38,172 52,176 200,66 348,176 362,172" fill="#8C3520"/>

  <!-- Round Attic Window -->
  <circle cx="200" cy="122" r="18" fill="#FFEAA7"/>
  <circle cx="200" cy="122" r="18" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="200" y1="104" x2="200" y2="140" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="182" y1="122" x2="218" y2="122" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Front Doorway -->
  <g id="house-doorway">
    <rect x="165" y="250" width="70" height="140" rx="35" rx-y="35" fill="#E2C9B4"/>
    <path d="M170,285 C170,265 185,255 200,255 C215,255 230,265 230,285 L230,390 L170,390 Z" fill="url(#door-wood)"/>
    <!-- Door Panels -->
    <rect x="178" y="290" width="18" height="38" rx="3" fill="#AB6E40"/>
    <rect x="204" y="290" width="18" height="38" rx="3" fill="#AB6E40"/>
    <rect x="178" y="338" width="18" height="42" rx="3" fill="#AB6E40"/>
    <rect x="204" y="338" width="18" height="42" rx="3" fill="#AB6E40"/>
    <!-- Brass Doorknob -->
    <circle cx="178" cy="336" r="3.5" fill="#FFD166"/>

    <!-- Porch Lantern & Light -->
    <circle cx="200" cy="235" r="35" fill="url(#lamp-glow)"/>
    <polygon points="194,228 206,228 204,242 196,242" fill="#FFEAA7"/>
    <rect x="193" y="224" width="14" height="4" fill="#3D3A37"/>
    <circle cx="200" cy="235" r="3" fill="#FFB703"/>
  </g>

  <!-- Left Window (Cozy Warm Glow) -->
  <g transform="translate(90, 240)">
    <rect x="0" y="0" width="55" height="75" rx="6" fill="#FFF9ED" stroke="#D3B89D" stroke-width="4"/>
    <rect x="4" y="4" width="47" height="67" rx="3" fill="#FFE8B2"/>
    <line x1="27" y1="4" x2="27" y2="71" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="4" y1="36" x2="51" y2="36" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Flower Box beneath window -->
    <rect x="-4" y="73" width="63" height="14" rx="2" fill="#9C6644"/>
    <circle cx="8" cy="72" r="5" fill="#FF758F"/>
    <circle cx="20" cy="70" r="6" fill="#F4A261"/>
    <circle cx="33" cy="71" r="5" fill="#FF758F"/>
    <circle cx="45" cy="70" r="6" fill="#FFD166"/>
  </g>

  <!-- Right Window -->
  <g transform="translate(255, 240)">
    <rect x="0" y="0" width="55" height="75" rx="6" fill="#FFF9ED" stroke="#D3B89D" stroke-width="4"/>
    <rect x="4" y="4" width="47" height="67" rx="3" fill="#FFE8B2"/>
    <line x1="27" y1="4" x2="27" y2="71" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="4" y1="36" x2="51" y2="36" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Flower Box beneath window -->
    <rect x="-4" y="73" width="63" height="14" rx="2" fill="#9C6644"/>
    <circle cx="8" cy="72" r="5" fill="#FF758F"/>
    <circle cx="20" cy="70" r="6" fill="#FFD166"/>
    <circle cx="33" cy="71" r="5" fill="#F4A261"/>
    <circle cx="45" cy="70" r="6" fill="#FF758F"/>
  </g>

  <!-- Front Doorstep Stones -->
  <path d="M155,390 L245,390 L250,405 L150,405 Z" fill="#D3B89D"/>
</svg>
