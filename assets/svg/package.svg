<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <!-- Cardboard Box Gradients -->
    <linearGradient id="box-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4C19C"/>
      <stop offset="100%" stop-color="#C59B70"/>
    </linearGradient>
    <linearGradient id="box-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7AE86"/>
      <stop offset="100%" stop-color="#B28558"/>
    </linearGradient>
    <linearGradient id="lid-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D7BC"/>
      <stop offset="100%" stop-color="#D9B48F"/>
    </linearGradient>
    <linearGradient id="lid-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2BF99"/>
      <stop offset="100%" stop-color="#BC9368"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="pkg-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF99AC"/>
      <stop offset="100%" stop-color="#E63956"/>
    </linearGradient>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5C3826" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Ambient Contact Shadow -->
  <ellipse cx="160" cy="245" rx="110" ry="22" fill="#5A3A28" opacity="0.32" filter="blur(6px)"/>

  <!-- Package Base Container -->
  <g id="box-base-group" filter="url(#drop-shadow)">
    <!-- Box Front Face -->
    <path d="M60,135 L260,135 L252,240 L68,240 Z" fill="url(#box-front)"/>

    <!-- Kraft Texture & Seam Lines -->
    <line x1="60" y1="135" x2="68" y2="240" stroke="#AA7E53" stroke-width="2"/>
    <line x1="260" y1="135" x2="252" y2="240" stroke="#AA7E53" stroke-width="2"/>
    <line x1="68" y1="240" x2="252" y2="240" stroke="#8D6238" stroke-width="2.5"/>

    <!-- Vertical Center Ribbon on Base -->
    <rect x="148" y="135" width="24" height="105" fill="url(#pkg-ribbon)"/>

    <!-- Postage / Fragile Stamp -->
    <g transform="translate(85, 155)">
      <rect x="0" y="0" width="46" height="34" rx="4" fill="#FFF9F2" stroke="#E2CDBA" stroke-width="1.5"/>
      <!-- Cute Flower Postal Stamp -->
      <path d="M23,10 C20,7 15,9 15,13 C15,17 23,22 23,22 C23,22 31,17 31,13 C31,9 26,7 23,10 Z" fill="#E63956"/>
      <line x1="8" y1="26" x2="38" y2="26" stroke="#9C7753" stroke-width="1.2" stroke-dasharray="2,2"/>
    </g>

    <!-- "Special Delivery" handwritten style badge -->
    <g transform="translate(182, 175) rotate(-6)">
      <rect x="0" y="0" width="52" height="28" rx="3" fill="#FFE8D6" stroke="#DDB892" stroke-width="1"/>
      <text x="26" y="18" font-family="'Outfit', sans-serif" font-size="8" font-weight="700" fill="#7F4F24" text-anchor="middle" letter-spacing="1">FOR YOU</text>
    </g>
  </g>

  <!-- Box Lid Group (Animates / Lifts Off) -->
  <g id="box-lid-group">
    <!-- Lid Top Surface -->
    <path d="M48,95 L272,95 L266,136 L54,136 Z" fill="url(#lid-rim)" filter="url(#drop-shadow)"/>
    <path d="M48,95 L75,70 L245,70 L272,95 Z" fill="url(#lid-top)"/>

    <!-- Lid Rim Bottom Lip -->
    <path d="M54,136 L266,136 L263,142 L57,142 Z" fill="#996E44"/>

    <!-- Ribbon Across Lid -->
    <path d="M148,70 L172,70 L172,136 L148,136 Z" fill="url(#pkg-ribbon)"/>

    <!-- Cute Tied Ribbon Bow on Top of Lid -->
    <g id="lid-bow" transform="translate(160, 68)">
      <!-- Left bow loop -->
      <path d="M0,2 C-25,-18 -38,5 -8,2 Z" fill="url(#pkg-ribbon)"/>
      <path d="M-5,1 C-18,-8 -26,2 -8,2 Z" fill="#FFC2D1" opacity="0.6"/>

      <!-- Right bow loop -->
      <path d="M0,2 C25,-18 38,5 8,2 Z" fill="url(#pkg-ribbon)"/>
      <path d="M5,1 C18,-8 26,2 8,2 Z" fill="#FFC2D1" opacity="0.6"/>

      <!-- Hanging ribbon tails -->
      <path d="M-3,3 Q-16,22 -22,34 Q-12,28 -3,20 Z" fill="url(#pkg-ribbon)"/>
      <path d="M3,3 Q16,22 22,34 Q12,28 3,20 Z" fill="url(#pkg-ribbon)"/>

      <!-- Knot -->
      <circle cx="0" cy="2" r="6" fill="#C9184A"/>
      <circle cx="0" cy="2" r="3.5" fill="#FF85A1"/>
    </g>
  </g>
</svg>
