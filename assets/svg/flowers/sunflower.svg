<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <radialGradient id="sun-glow" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#F4A261" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F4A261" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#558B2F"/>
      <stop offset="100%" stop-color="#33691E"/>
    </linearGradient>
    <linearGradient id="sun-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#689F38"/>
      <stop offset="100%" stop-color="#33691E"/>
    </linearGradient>
    <linearGradient id="petal-gold-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="petal-gold-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="40%" stop-color="#FBC02D"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <radialGradient id="disk-core" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="40%" stop-color="#3E2723"/>
      <stop offset="85%" stop-color="#27140B"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="160" cy="155" r="145" fill="url(#sun-glow)" class="flower-glow-halo"/>

  <!-- Stem and Broad Heart-shaped Foliage -->
  <g id="sunflower-foliage">
    <!-- Sturdy stem -->
    <path d="M160,205 Q158,290 162,390" fill="none" stroke="url(#sun-stem)" stroke-width="9" stroke-linecap="round"/>

    <!-- Left Broad Leaf -->
    <path d="M158,285 C115,260 70,280 60,320 C90,345 135,325 158,298 Z" fill="url(#sun-leaf)"/>
    <path d="M158,285 Q110,305 68,318" fill="none" stroke="#8BC34A" stroke-width="2" stroke-linecap="round"/>
    <path d="M125,298 Q105,285 92,295" fill="none" stroke="#8BC34A" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M135,307 Q120,320 102,322" fill="none" stroke="#8BC34A" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Right Broad Leaf -->
    <path d="M162,250 C195,225 245,235 258,275 C230,298 185,285 162,260 Z" fill="url(#sun-leaf)"/>
    <path d="M162,250 Q210,260 250,272" fill="none" stroke="#8BC34A" stroke-width="2" stroke-linecap="round"/>
    <path d="M195,256 Q215,245 230,250" fill="none" stroke="#8BC34A" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M210,265 Q225,278 240,277" fill="none" stroke="#8BC34A" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- Sunflower Head -->
  <g id="sunflower-bloom" transform-origin="160 155">
    <!-- Tier 1: Background Petals (16 radiating petals) -->
    <g id="petals-back" fill="url(#petal-gold-back)">
      <!-- 0 deg -->
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(0 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(22.5 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(45 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(67.5 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(90 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(112.5 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(135 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(157.5 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(180 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(202.5 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(225 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(247.5 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(270 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(292.5 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(315 160 155)"/>
      <path d="M160,65 C153,95 152,115 160,115 C168,115 167,95 160,65 Z" transform="rotate(337.5 160 155)"/>
    </g>

    <!-- Tier 2: Foreground Golden Petals (Offset by 11.25 deg) -->
    <g id="petals-front" fill="url(#petal-gold-front)">
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(11.25 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(33.75 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(56.25 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(78.75 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(101.25 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(123.75 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(146.25 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(168.75 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(191.25 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(213.75 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(236.25 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(258.75 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(281.25 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(303.75 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(326.25 160 155)"/>
      <path d="M160,68 C151,96 150,118 160,118 C170,118 169,96 160,68 Z" transform="rotate(348.75 160 155)"/>
    </g>

    <!-- Center Seed Disk -->
    <circle cx="160" cy="155" r="44" fill="url(#disk-core)"/>
    <!-- Seed rim accent ring -->
    <circle cx="160" cy="155" r="44" fill="none" stroke="#A1887F" stroke-width="1.8" stroke-dasharray="2,3" opacity="0.6"/>
    <circle cx="160" cy="155" r="32" fill="none" stroke="#D7CCC8" stroke-width="1.2" stroke-dasharray="1.5,2.5" opacity="0.4"/>
    <circle cx="160" cy="155" r="18" fill="none" stroke="#D7CCC8" stroke-width="1.2" stroke-dasharray="1,2" opacity="0.5"/>
  </g>
</svg>
