<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <radialGradient id="daisy-glow" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFD166" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="daisy-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B9080"/>
      <stop offset="100%" stop-color="#406254"/>
    </linearGradient>
    <linearGradient id="daisy-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79A390"/>
      <stop offset="100%" stop-color="#3D5A4C"/>
    </linearGradient>
    <linearGradient id="daisy-petal-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8E8ED"/>
      <stop offset="100%" stop-color="#D0D0DA"/>
    </linearGradient>
    <linearGradient id="daisy-petal-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F7F7FA"/>
      <stop offset="100%" stop-color="#E5E5EE"/>
    </linearGradient>
    <radialGradient id="daisy-center" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#E76F51"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="160" cy="150" r="145" fill="url(#daisy-glow)" class="flower-glow-halo"/>

  <!-- Slender Stem and Dainty Foliage -->
  <g id="daisy-foliage">
    <path d="M160,195 Q158,285 162,390" fill="none" stroke="url(#daisy-stem)" stroke-width="7" stroke-linecap="round"/>

    <!-- Left Serrated Daisy Leaf -->
    <path d="M159,280 C125,260 100,270 85,300 C110,312 140,295 159,290 Z" fill="url(#daisy-leaf)"/>
    <path d="M159,280 Q120,285 90,298" fill="none" stroke="#A4C3B2" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Right Serrated Daisy Leaf -->
    <path d="M161,245 C190,230 225,235 235,265 C210,278 180,265 161,255 Z" fill="url(#daisy-leaf)"/>
    <path d="M161,245 Q200,250 230,262" fill="none" stroke="#A4C3B2" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Daisy Bloom -->
  <g id="daisy-bloom" transform-origin="160 150">
    <!-- Back tier petals (18 radiating petals) -->
    <g id="daisy-back-petals" fill="url(#daisy-petal-back)">
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(0 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(20 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(40 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(60 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(80 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(100 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(120 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(140 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(160 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(180 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(200 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(220 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(240 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(260 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(280 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(300 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(320 160 150)"/>
      <path d="M160,55 C154,85 153,115 160,115 C167,115 166,85 160,55 Z" transform="rotate(340 160 150)"/>
    </g>

    <!-- Front tier pure white crisp petals (offset by 10 deg) -->
    <g id="daisy-front-petals" fill="url(#daisy-petal-front)">
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(10 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(30 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(50 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(70 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(90 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(110 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(130 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(150 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(170 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(190 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(210 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(230 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(250 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(270 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(290 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(310 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(330 160 150)"/>
      <path d="M160,58 C153,88 152,118 160,118 C168,118 167,88 160,58 Z" transform="rotate(350 160 150)"/>
    </g>

    <!-- Warm Glowing Golden Center Button -->
    <circle cx="160" cy="150" r="34" fill="url(#daisy-center)"/>
    <circle cx="160" cy="150" r="34" fill="none" stroke="#F4A261" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.6"/>
    <circle cx="160" cy="150" r="22" fill="none" stroke="#FFF" stroke-width="1.2" stroke-dasharray="1.5,2.5" opacity="0.5"/>
  </g>
</svg>
